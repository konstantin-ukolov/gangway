{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gangway.fullname" . }}
  labels:
    {{- include "gangway.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.route.hostname | quote }}
  parentRefs:
    - name: {{ .Values.route.parentRef.name }}
      sectionName: {{ .Values.route.parentRef.sectionName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "gangway.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
