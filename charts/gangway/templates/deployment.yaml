apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gangway.fullname" . }}
  labels:
    {{- include "gangway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      {{- include "gangway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gangway.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gangway
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/gangway/gangway.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GANGWAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.clientSecretKey }}
            - name: GANGWAY_CLUSTER_NAME
              value: {{ .Values.config.clusterName | quote }}
            - name: GANGWAY_APP_NAME
              value: {{ .Values.config.appName | quote }}
            - name: GANGWAY_COMPANY_NAME
              value: {{ .Values.config.companyName | quote }}
            - name: GANGWAY_COMPANY_LOGO
              value: {{ .Values.config.companyLogo | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/gangway
              readOnly: true
            - name: trusted-ca
              mountPath: /etc/gangway/ca
              readOnly: true
            - name: cluster-ca
              mountPath: /etc/gangway/cluster-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "gangway.fullname" . }}
        - name: trusted-ca
          secret:
            secretName: {{ .Values.secret.name }}
            items:
              - key: {{ .Values.secret.trustedCAKey }}
                path: ca.crt
        - name: cluster-ca
          secret:
            secretName: {{ .Values.secret.name }}
            items:
              - key: {{ .Values.secret.clusterCAKey }}
                path: ca.crt
        - name: tmp
          emptyDir: {}
