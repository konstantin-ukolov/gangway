apiVersion: apps/v1
kind: Deployment
metadata:
  name: gangway
  namespace: dex
  labels:
    app.kubernetes.io/name: gangway
    app.kubernetes.io/part-of: kubernetes-oidc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gangway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gangway
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: nexus-registry
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gangway
          image: nexus-infra.admins-infra.common.pd34.udp.gtn/gangway/gangway@sha256:1897436027263806bf235f912ab18ae7cf5735856775f2752229f540107585ef
          imagePullPolicy: Always
          args: ["-config", "/etc/gangway/gangway.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GANGWAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gangway-secrets
                  key: clientSecret
            - name: GANGWAY_CLUSTER_NAME
              value: suecp-cluster
            - name: GANGWAY_APP_NAME
              value: Кластер СУ ЕЦП
            - name: GANGWAY_COMPANY_NAME
              value: Гистех
            - name: GANGWAY_COMPANY_LOGO
              value: /assets/layered-logo.svg
          volumeMounts:
            - name: config
              mountPath: /etc/gangway
              readOnly: true
            - name: trusted-ca
              mountPath: /etc/gangway/ca
              readOnly: true
            - name: cluster-ca
              mountPath: /etc/gangway/cluster-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gangway
        - name: trusted-ca
          secret:
            secretName: gangway-secrets
            items:
              - key: ca.crt
                path: ca.crt
        - name: cluster-ca
          secret:
            secretName: gangway-secrets
            items:
              - key: cluster-ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
