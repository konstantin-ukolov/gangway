apiVersion: v1
kind: Secret
metadata:
  name: gangway-secrets
  namespace: dex
type: Opaque
stringData:
  clientSecret: "<GANGWAY_OIDC_CLIENT_SECRET>"
  sessionSecurityKey: "<RANDOM_64_BYTE_SESSION_KEY>"
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    <INTERNAL_PKI_CA_USED_BY_DEX_TLS>
    -----END CERTIFICATE-----
  cluster-ca.crt: |
    -----BEGIN CERTIFICATE-----
    <KUBERNETES_API_SERVER_CA>
    -----END CERTIFICATE-----
