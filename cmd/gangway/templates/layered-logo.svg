    "/>

    <!-- Front / upper sheet -->
    <path d="
      M 55,164
      C 76,125 99,78 120,56
      C 126,50 135,47 145,46
      L 216,37
      C 234,35 242,43 235,60
      L 190,177
      C 182,199 166,210 145,204
